<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>足球戰術影像分析工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; 
            color: #f3f4f6;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            transition: background-color 0.3s;
        }
        
        /* Cinema / Highlight Mode Layout */
        body.highlight-mode > header,
        body.highlight-mode .hide-in-highlight {
            display: none !important;
        }
        body.highlight-mode {
            padding: 0;
            margin: 0;
            background-color: #000;
        }
        body.highlight-mode main {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            max-width: none;
            padding: 0;
            gap: 0;
        }
        body.highlight-mode .video-container {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            border-radius: 0;
            aspect-ratio: 16 / 9;
            box-shadow: none;
        }

        /* 影片與畫布容器 */
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 0.75rem 0.75rem 0 0;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        #localVideo, #ytPlayerContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #ytPlayerContainer { pointer-events: none; }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            touch-action: none;
            pointer-events: none;
        }

        .hidden-player { display: none !important; }

        /* Timeline Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer; background: #4b5563; border-radius: 2px;
        }
        input[type=range]:focus { outline: none; }

        .tool-btn.active { background-color: #374151; border-color: #60a5fa; color: #93c5fd; }
        .color-btn.active { transform: scale(1.2); box-shadow: 0 0 0 2px #1f2937, 0 0 0 4px #fff; }
        
        .tag-item.has-drawing {
            border-left-width: 4px;
            border-left-color: #f97316; /* orange-500 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-6 antialiased">

    <!-- Highlight Mode 退出按鈕 -->
    <button id="exitHighlightBtn" class="fixed top-4 right-4 z-50 bg-red-600/90 hover:bg-red-700 text-white px-5 py-2.5 rounded-lg hidden shadow-xl font-bold backdrop-blur-sm transition-all border border-red-500 flex items-center gap-2">
        <span>⏹</span> 結束精華模式
    </button>

    <!-- Header 頂部導覽 -->
    <header class="max-w-7xl mx-auto w-full mb-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
        <div>
            <h1 class="text-2xl font-extrabold text-white flex items-center gap-2.5">
                ⚽ 戰術分析板 <span class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded-md font-bold tracking-wider">CINEMA 2.0</span>
            </h1>
            <p class="text-sm text-gray-400 mt-1">匯入比賽素材、畫線解說，並一鍵匯出電視級自動精華集錦</p>
        </div>
        
        <div class="flex flex-col sm:flex-row w-full lg:w-auto items-stretch sm:items-center gap-3">
            <label class="cursor-pointer bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                📁 載入 MP4
                <input type="file" id="videoUpload" accept="video/mp4,video/x-m4v,video/*" class="hidden">
            </label>
            <div class="text-gray-500 font-medium text-sm text-center hidden sm:block">或</div>
            <div class="flex flex-grow sm:flex-grow-0">
                <input type="text" id="ytUrlInput" placeholder="貼上 YouTube 連結..." class="bg-gray-800 border border-gray-700 text-white text-sm rounded-l-lg focus:ring-blue-500 block w-full p-2.5 outline-none placeholder-gray-500">
                <button id="loadYtBtn" class="bg-red-600 hover:bg-red-700 text-white rounded-r-lg px-4 py-2 text-sm font-medium transition-colors whitespace-nowrap">
                    匯入 YT
                </button>
            </div>
        </div>
    </header>

    <div id="errorMsg" class="max-w-7xl mx-auto w-full mb-4 text-red-400 text-sm font-medium hidden"></div>

    <!-- 主分析介面 -->
    <main class="max-w-7xl mx-auto w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 左側：影片播放與戰術繪圖區 -->
        <div class="lg:col-span-2 flex flex-col w-full relative">
            <div class="video-container" id="videoWrapper">
                <div id="placeholderUI" class="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-0">
                    <svg class="w-12 h-12 mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                    <p>請載入本機影片或 YouTube 連結以開始分析</p>
                </div>
                <video id="localVideo" playsinline webkit-playsinline disablePictureInPicture class="hidden-player"></video>
                <div id="ytPlayerContainer" class="hidden-player"></div>
                <canvas id="drawingCanvas"></canvas>
                
                <!-- 無畫圖時的精華動態角落 Badge -->
                <div id="highlightBadge" class="absolute top-6 left-6 z-50 bg-black/80 text-white font-bold px-4 py-2 rounded-xl shadow-2xl border border-white/20 flex items-center gap-2.5 hidden transition-all duration-300 backdrop-blur-md">
                    <span class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></span>
                    <span id="highlightBadgeText" class="text-sm md:text-base"></span>
                </div>

                <!-- 有畫圖時的精華暫停中央標題卡 -->
                <div id="highlightTitle" class="absolute bottom-10 left-1/2 transform -translate-x-1/2 z-50 text-white text-xl md:text-3xl font-extrabold bg-black/85 px-6 py-3 rounded-2xl hidden tracking-wide border border-white/20 shadow-2xl transition-all duration-300 backdrop-blur-md pointer-events-none text-center min-w-[240px]">
                </div>
            </div>

            <!-- 時間軸與播放控制列 -->
            <div class="hide-in-highlight bg-gray-800 p-4 border-x border-b border-gray-700 flex flex-col gap-3">
                <div class="flex items-center gap-4">
                    <button id="playPauseBtn" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-full transition-colors flex-shrink-0 flex items-center justify-center w-10 h-10 shadow-lg shadow-blue-900/20">
                        <svg id="playIcon" class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        <svg id="pauseIcon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    </button>
                    <input type="range" id="timeline" min="0" max="100" value="0" class="flex-grow">
                    <div id="timeDisplay" class="text-xs text-gray-400 font-mono w-24 text-right">00:00 / 00:00</div>
                </div>
            </div>

            <!-- 戰術繪圖工具列 -->
            <div class="hide-in-highlight bg-gray-900 p-3 rounded-b-xl border border-gray-700 border-t-0 flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <button class="tool-btn active border border-gray-600 text-gray-400 p-2 rounded-lg transition-colors hover:bg-gray-800" data-tool="pen" title="自由筆劃">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </button>
                    <button class="tool-btn border border-gray-600 text-gray-400 p-2 rounded-lg transition-colors hover:bg-gray-800" data-tool="arrow" title="戰術箭頭 (傳球/跑位)">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                    <button class="tool-btn border border-gray-600 text-gray-400 p-2 rounded-lg transition-colors hover:bg-gray-800" data-tool="circle" title="圈選球員/空間">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 20a8 8 0 100-16 8 8 0 000 16z"></path></svg>
                    </button>
                    
                    <div class="w-px h-6 bg-gray-700 mx-2"></div>
                    
                    <button class="color-btn active w-6 h-6 rounded-full bg-red-500 transition-transform" data-color="#ef4444"></button>
                    <button class="color-btn w-6 h-6 rounded-full bg-blue-500 transition-transform" data-color="#3b82f6"></button>
                    <button class="color-btn w-6 h-6 rounded-full bg-yellow-400 transition-transform" data-color="#facc15"></button>
                    <button class="color-btn w-6 h-6 rounded-full bg-white transition-transform" data-color="#ffffff"></button>
                </div>

                <div class="flex items-center gap-2">
                    <div class="text-xs font-medium flex items-center gap-1.5 mr-2">
                        <span id="drawStatusIndicator" class="w-2 h-2 rounded-full bg-gray-500"></span>
                        <span id="drawStatusText" class="text-gray-400">等待載入</span>
                    </div>
                    <button id="undoBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded border border-gray-700 font-medium transition-colors text-xs flex items-center gap-1" title="復原 (Ctrl+Z)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                    </button>
                    <button id="clearBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded border border-gray-700 font-medium transition-colors text-xs flex items-center gap-1">
                        清除畫布
                    </button>
                </div>
            </div>
        </div>

        <!-- 右側：事件標記與時間軸紀錄 -->
        <div class="hide-in-highlight flex flex-col gap-4">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-sm relative">
                <h2 class="text-sm font-semibold text-gray-300 mb-4 uppercase tracking-wider">即時事件打標</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-1 xl:grid-cols-3 gap-3">
                    <button class="tag-btn bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 py-3 rounded-lg font-bold text-sm transition-all active:scale-95" data-type="危險失誤">❌ 失誤</button>
                    <button class="tag-btn bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 py-3 rounded-lg font-bold text-sm transition-all active:scale-95" data-type="漂亮傳導">✅ 好球</button>
                    <button class="tag-btn bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 py-3 rounded-lg font-bold text-sm transition-all active:scale-95" data-type="關鍵進球">⚽ 進球</button>
                </div>
            </div>

            <div class="bg-gray-800 rounded-xl border border-gray-700 flex-grow flex flex-col h-72 lg:h-auto overflow-hidden shadow-sm">
                <div class="p-3 border-b border-gray-700 bg-gray-800/50 flex justify-between items-center gap-2">
                    <div class="flex items-center gap-2">
                        <h2 class="font-semibold text-gray-200 text-sm">時間軸紀錄</h2>
                        <span id="tagCount" class="text-xs bg-gray-700 text-gray-300 px-2 py-1 rounded-md font-mono">0</span>
                    </div>
                    <button id="playHighlightsBtn" class="bg-gradient-to-r from-orange-600 to-rose-600 hover:from-orange-500 hover:to-rose-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg transition-all flex items-center gap-1.5">
                        🎬 播放精華
                    </button>
                </div>
                <ul id="tagList" class="flex-grow overflow-y-auto p-3 space-y-2">
                    <li id="emptyListMsg" class="text-center text-gray-500 text-sm mt-8 pointer-events-none">
                        尚無標記紀錄<br><span class="text-xs mt-1 block">暫停畫線後點擊 💾 可儲存畫面</span>
                    </li>
                </ul>
            </div>
        </div>
    </main>

<script>
    // --- YouTube API 動態載入 ---
    let ytApiReady = false;
    function loadYTScript() {
        if (window.YT && window.YT.Player) {
            ytApiReady = true;
            return;
        }
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }
    window.onYouTubeIframeAPIReady = function() { ytApiReady = true; };
    loadYTScript();

    // --- DOM 元素引用 ---
    const localVideo = document.getElementById('localVideo');
    const ytPlayerContainer = document.getElementById('ytPlayerContainer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const timeline = document.getElementById('timeline');
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const tagList = document.getElementById('tagList');
    const playHighlightsBtn = document.getElementById('playHighlightsBtn');
    const exitHighlightBtn = document.getElementById('exitHighlightBtn');
    const highlightTitle = document.getElementById('highlightTitle');
    const highlightBadge = document.getElementById('highlightBadge');
    const highlightBadgeText = document.getElementById('highlightBadgeText');

    // --- 全局狀態變數 ---
    let currentMode = null; // 'local' | 'youtube'
    let isVideoPaused = true;
    let ytPlayer = null;
    let tags = [];
    let syncInterval = null;

    // 繪圖狀態
    let isDrawing = false;
    let currentTool = 'pen';
    let currentColor = '#ef4444';
    let startPos = {x: 0, y: 0};
    let canvasSnapshot;
    let drawHistory = [];

    // 精華模式引擎狀態
    let isHighlightMode = false;
    let currentHighlightIndex = 0;
    let highlightTimer = null;
    let highlightTimeout = null;

    // --- 工具列與 UI 切換 ---
    document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            currentTool = e.currentTarget.getAttribute('data-tool');
        });
    });
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            currentColor = e.currentTarget.getAttribute('data-color');
            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor;
        });
    });

    // --- 影片核心邏輯 ---
    function showError(msg) {
        const err = document.getElementById('errorMsg');
        err.textContent = msg; err.classList.remove('hidden');
        setTimeout(() => err.classList.add('hidden'), 5000);
    }

    function resetPlayerState(mode) {
        currentMode = mode;
        document.getElementById('placeholderUI').style.display = 'none';
        tags = []; renderTags(); clearCanvas();
        drawHistory = [];
        updateUIState(true);
        if (syncInterval) clearInterval(syncInterval);
        startTimelineSync();
    }

    document.getElementById('loadYtBtn').addEventListener('click', () => {
        const url = document.getElementById('ytUrlInput').value.trim();
        const match = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (!match) return showError("無法解析 YouTube 連結。");
        if (!ytApiReady) return showError("YouTube API 載入中，請稍後。");

        localVideo.classList.add('hidden-player');
        localVideo.pause();
        ytPlayerContainer.classList.remove('hidden-player');
        resetPlayerState('youtube');

        if (ytPlayer) { ytPlayer.loadVideoById(match[1]); } 
        else {
            ytPlayer = new YT.Player('ytPlayerContainer', {
                videoId: match[1],
                playerVars: { 'playsinline': 1, 'controls': 0, 'disablekb': 1, 'rel': 0 },
                events: {
                    'onReady': resizeCanvas,
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) updateUIState(false);
                        else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) updateUIState(true);
                    }
                }
            });
        }
        document.getElementById('ytUrlInput').value = '';
    });

    document.getElementById('videoUpload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            if(ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
            ytPlayerContainer.classList.add('hidden-player');
            localVideo.classList.remove('hidden-player');
            resetPlayerState('local');
            localVideo.src = URL.createObjectURL(file);
            localVideo.onloadedmetadata = () => { resizeCanvas(); };
        }
    });

    localVideo.addEventListener('play', () => updateUIState(false));
    localVideo.addEventListener('pause', () => updateUIState(true));

    function playUnified() {
        if (currentMode === 'local') localVideo.play();
        else if (currentMode === 'youtube' && ytPlayer) ytPlayer.playVideo();
    }
    function pauseUnified() {
        if (currentMode === 'local') localVideo.pause();
        else if (currentMode === 'youtube' && ytPlayer) ytPlayer.pauseVideo();
    }
    function getUnifiedTime() {
        if (currentMode === 'local') return localVideo.currentTime;
        if (currentMode === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) return ytPlayer.getCurrentTime() || 0;
        return 0;
    }
    function getUnifiedDuration() {
        if (currentMode === 'local') return localVideo.duration || 0;
        if (currentMode === 'youtube' && ytPlayer && ytPlayer.getDuration) return ytPlayer.getDuration() || 0;
        return 0;
    }
    function seekUnified(time) {
        if (currentMode === 'local') { localVideo.currentTime = time; } 
        else if (currentMode === 'youtube' && ytPlayer && typeof ytPlayer.seekTo === 'function') { ytPlayer.seekTo(time, true); }
    }

    function updateUIState(paused) {
        isVideoPaused = paused;
        const ind = document.getElementById('drawStatusIndicator');
        const txt = document.getElementById('drawStatusText');
        
        if (paused) {
            canvas.style.pointerEvents = 'auto';
            ind.className = 'w-2 h-2 rounded-full bg-red-500 animate-pulse';
            txt.textContent = '暫停中 (可繪圖)';
            txt.className = 'text-red-400';
            document.getElementById('playIcon').classList.remove('hidden');
            document.getElementById('pauseIcon').classList.add('hidden');
        } else {
            canvas.style.pointerEvents = 'none';
            ind.className = 'w-2 h-2 rounded-full bg-emerald-500';
            txt.textContent = '播放中';
            txt.className = 'text-emerald-400';
            document.getElementById('playIcon').classList.add('hidden');
            document.getElementById('pauseIcon').classList.remove('hidden');
            
            if (!isHighlightMode) {
                clearCanvas();
                drawHistory = [];
            }
        }
    }

    playPauseBtn.addEventListener('click', () => {
        if (!currentMode) return;
        isVideoPaused ? playUnified() : pauseUnified();
    });

    // --- 時間軸同步 ---
    function formatTime(s) {
        if(isNaN(s) || s < 0) return "00:00";
        return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
    }
    function startTimelineSync() {
        syncInterval = setInterval(() => {
            const d = getUnifiedDuration();
            if(d > 0 && timeline.max == 100) timeline.max = d;
            if (!isVideoPaused && !isHighlightMode) {
                timeline.value = getUnifiedTime();
            }
            document.getElementById('timeDisplay').innerText = formatTime(timeline.value) + ' / ' + formatTime(d);
        }, 100);
    }
    timeline.addEventListener('input', (e) => {
        if (!currentMode) return;
        pauseUnified();
        seekUnified(parseFloat(e.target.value));
    });

    // --- 畫布繪圖引擎 & Undo ---
    function resizeCanvas() {
        const wrapper = document.getElementById('videoWrapper');
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 4;
        ctx.strokeStyle = currentColor; ctx.fillStyle = currentColor;
    }
    window.addEventListener('resize', () => { setTimeout(resizeCanvas, 150); });

    function saveHistoryState() {
        drawHistory.push(canvas.toDataURL());
        if(drawHistory.length > 20) drawHistory.shift();
    }

    document.getElementById('undoBtn').addEventListener('click', () => {
        if(drawHistory.length > 0) {
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
            img.src = drawHistory.pop();
        } else {
            clearCanvas();
        }
    });

    // 鍵盤快速鍵支援
    window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            e.preventDefault();
            document.getElementById('undoBtn').click();
        } else if (e.key === ' ') {
            e.preventDefault();
            playPauseBtn.click();
        } else if (e.key.toLowerCase() === 'c') {
            clearCanvas();
        }
    });

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function startDrawing(e) {
        if (!isVideoPaused || !currentMode) return;
        e.preventDefault();
        saveHistoryState();
        isDrawing = true;
        startPos = getPos(e);
        canvasSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.moveTo(startPos.x, startPos.y);
    }

    function draw(e) {
        if (!isDrawing || !isVideoPaused) return;
        e.preventDefault();
        const pos = getPos(e);

        if (currentTool === 'pen') {
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        } else {
            ctx.putImageData(canvasSnapshot, 0, 0);
            if (currentTool === 'arrow') {
                const headlen = 16;
                const angle = Math.atan2(pos.y - startPos.y, pos.x - startPos.x);
                ctx.beginPath(); ctx.moveTo(startPos.x, startPos.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
                ctx.lineTo(pos.x - headlen * Math.cos(angle - Math.PI/6), pos.y - headlen * Math.sin(angle - Math.PI/6));
                ctx.lineTo(pos.x - headlen * Math.cos(angle + Math.PI/6), pos.y - headlen * Math.sin(angle + Math.PI/6));
                ctx.lineTo(pos.x, pos.y); ctx.fill();
            } else if (currentTool === 'circle') {
                const r = Math.sqrt(Math.pow(pos.x - startPos.x, 2) + Math.pow(pos.y - startPos.y, 2));
                ctx.beginPath(); ctx.arc(startPos.x, startPos.y, r, 0, 2 * Math.PI); ctx.stroke();
            }
        }
    }

    function stopDrawing(e) {
        if (isDrawing) e.preventDefault();
        isDrawing = false;
        ctx.closePath();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing, { passive: false });

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    document.getElementById('clearBtn').addEventListener('click', clearCanvas);

    // --- 標籤打標與時間軸清單 ---
    document.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            if (!currentMode) return showError("請先載入影片。");
            const type = e.target.getAttribute('data-type');
            tags.push({ type, time: getUnifiedTime(), id: Date.now(), drawing: null });
            tags.sort((a, b) => a.time - b.time);
            renderTags();
        });
    });

    function renderTags() {
        tagList.innerHTML = '';
        document.getElementById('tagCount').textContent = tags.length;
        if (tags.length === 0) {
            document.getElementById('emptyListMsg').style.display = 'block';
            return;
        }
        document.getElementById('emptyListMsg').style.display = 'none';

        tags.forEach(tag => {
            const li = document.createElement('li');
            li.className = `tag-item flex justify-between items-center p-3 rounded-lg cursor-pointer transition-colors border bg-gray-800 hover:bg-gray-700 border-gray-600 ${tag.drawing ? 'has-drawing' : ''}`;
            li.dataset.id = tag.id;
            li.innerHTML = `
                <div class="flex flex-col gap-1 pointer-events-none">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-gray-200">${tag.type}</span>
                        ${tag.drawing ? '<span class="text-[10px] bg-orange-500/20 text-orange-400 px-1.5 py-0.5 rounded border border-orange-500/30 font-medium">已存圖</span>' : ''}
                    </div>
                    <span class="text-gray-400 text-xs font-medium">時間: ${formatTime(tag.time)}</span>
                </div>
                <div class="flex items-center gap-1.5 z-10">
                    <button class="save-drawing-btn bg-gray-700 hover:bg-blue-600 text-white p-1.5 rounded transition-colors text-xs" data-id="${tag.id}" title="儲存當前畫布至此標籤">💾</button>
                    <button class="delete-tag-btn bg-gray-700 hover:bg-red-600 text-white p-1.5 rounded transition-colors text-xs" data-id="${tag.id}" title="刪除標籤">🗑️</button>
                </div>
            `;
            tagList.appendChild(li);
        });
    }

    tagList.addEventListener('click', (e) => {
        const btnSave = e.target.closest('.save-drawing-btn');
        const btnDel = e.target.closest('.delete-tag-btn');
        const tagItem = e.target.closest('.tag-item');

        if (btnSave) {
            e.stopPropagation();
            const tag = tags.find(t => t.id === Number(btnSave.dataset.id));
            if (tag) {
                tag.drawing = canvas.toDataURL();
                renderTags();
            }
            return;
        }
        if (btnDel) {
            e.stopPropagation();
            tags = tags.filter(t => t.id !== Number(btnDel.dataset.id));
            renderTags();
            return;
        }
        if (tagItem) {
            pauseUnified();
            const tag = tags.find(t => t.id === Number(tagItem.dataset.id));
            if (tag) {
                seekUnified(Math.max(0, tag.time - 3));
                if (tag.drawing) {
                    const img = new Image();
                    img.onload = () => { clearCanvas(); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
                    img.src = tag.drawing;
                }
            }
        }
    });

    // --- 精華播放引擎 (Cinema Mode Highlights Engine) ---
    playHighlightsBtn.addEventListener('click', () => {
        if(tags.length === 0) return showError('請先新增標籤！');
        tags.sort((a, b) => a.time - b.time);
        
        isHighlightMode = true;
        document.body.classList.add('highlight-mode');
        exitHighlightBtn.classList.remove('hidden');
        
        setTimeout(() => {
            resizeCanvas();
            currentHighlightIndex = 0;
            runHighlightStep(0);
        }, 300);
    });

    function stopHighlightMode() {
        isHighlightMode = false;
        if (highlightTimer) { clearInterval(highlightTimer); highlightTimer = null; }
        if (highlightTimeout) { clearTimeout(highlightTimeout); highlightTimeout = null; }
        
        document.body.classList.remove('highlight-mode');
        exitHighlightBtn.classList.add('hidden');
        highlightTitle.classList.add('hidden');
        highlightBadge.classList.add('hidden');
        
        pauseUnified();
        clearCanvas();
        resizeCanvas();
        updateUIState(true);
    }

    exitHighlightBtn.addEventListener('click', stopHighlightMode);

    function runHighlightStep(index) {
        if (!isHighlightMode) return;
        
        if (index >= tags.length) {
            stopHighlightMode();
            return;
        }
        
        currentHighlightIndex = index;
        const tag = tags[index];
        const startTime = Math.max(0, tag.time - 4);
        
        if (highlightTimer) clearInterval(highlightTimer);
        if (highlightTimeout) clearTimeout(highlightTimeout);
        
        clearCanvas();
        seekUnified(startTime);
        playUnified();
        
        if (tag.drawing) {
            // 情況 1：有戰術圖 -> 播至事件點暫停，展示戰術畫布 3 秒
            highlightBadge.classList.add('hidden');
            
            highlightTimer = setInterval(() => {
                if (!isHighlightMode) return;
                const now = getUnifiedTime();
                if (now >= tag.time) {
                    clearInterval(highlightTimer);
                    highlightTimer = null;
                    
                    pauseUnified();
                    
                    // 渲染戰術畫布
                    const img = new Image();
                    img.onload = () => {
                        clearCanvas();
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    };
                    img.src = tag.drawing;
                    
                    // 呈現中央醒目標籤卡
                    highlightTitle.textContent = `${tag.type} (${formatTime(tag.time)})`;
                    highlightTitle.classList.remove('hidden');
                    
                    // 停留 3 秒後前往下一個標籤
                    highlightTimeout = setTimeout(() => {
                        highlightTitle.classList.add('hidden');
                        clearCanvas();
                        runHighlightStep(index + 1);
                    }, 3000);
                }
            }, 50);
        } else {
            // 情況 2：無戰術圖 -> 不暫停，持續流暢播放至 tag.time + 2.5 秒，並呈現角落 Badge
            highlightTitle.classList.add('hidden');
            const endTime = tag.time + 2.5;
            
            highlightBadgeText.textContent = `${tag.type} • ${formatTime(tag.time)}`;
            highlightBadge.classList.remove('hidden');
            
            highlightTimer = setInterval(() => {
                if (!isHighlightMode) return;
                const now = getUnifiedTime();
                if (now >= endTime) {
                    clearInterval(highlightTimer);
                    highlightTimer = null;
                    
                    // 無縫切換至下一個精華片段
                    runHighlightStep(index + 1);
                }
            }, 50);
        }
    }
</script>
</body>
</html>
